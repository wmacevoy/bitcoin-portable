name: Cross-Platform Test

on:
  push:
    branches:
      - master
      - test
  pull_request:
    branches:
      - master
      - test

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest and macos-13 cover arm64 and x86_64 respectively.
        os: [ubuntu-latest, macos-latest, macos-13, windows-latest]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run tests
        run: |
          chmod +x ./test
          ./test
        shell: bash
